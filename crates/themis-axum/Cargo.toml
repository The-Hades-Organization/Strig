[package]
name = "themis-axum"
description = "Rotas SSE e WebSocket do axum para as sessões de tempo real da Themis."
keywords = ["authorization", "axum", "sse", "websocket"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
themis.workspace = true
themis-sync.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "tokio"] }
futures-util = { workspace = true, features = ["sink"] }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
async-trait.workspace = true
axum = { version = "0.8", features = ["ws", "tokio", "http1", "query", "json"] }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
