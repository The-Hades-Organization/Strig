[package]
name = "themis"
description = "Motor de autorização extensível: catálogo de permissões, RBAC, ABAC e ReBAC numa decisão só, com governança das mudanças."
keywords = ["authorization", "rbac", "abac", "rebac", "permissions"]
categories = ["authentication"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["audit"]
## Trilha de auditoria das mudanças de permissão, com níveis de detalhe e cadeia de hashes.
audit = ["dep:sha2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[example]]
name = "audit_storage"
required-features = ["audit"]
