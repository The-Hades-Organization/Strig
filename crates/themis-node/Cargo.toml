[package]
name = "themis-node"
description = "JavaScript bindings for Themis: native module (N-API) for Node and Bun, WebAssembly for the browser."
keywords = ["authorization", "napi", "wasm", "nodejs", "bun"]
categories = ["authentication", "wasm"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Módulo nativo para Node e Bun (N-API).
napi = ["dep:napi", "dep:napi-derive"]
## WebAssembly para navegador, Deno e fallback do Node/Bun.
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dependencies]
themis.workspace = true
serde.workspace = true
serde_json.workspace = true
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[build-dependencies]
napi-build = "2"
