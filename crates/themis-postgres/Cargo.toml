[package]
name = "themis-postgres"
description = "Postgres LISTEN/NOTIFY transport for the Themis change hub."
keywords = ["authorization", "postgres", "notify", "realtime"]
categories = ["authentication", "database"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
themis-sync.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tokio-postgres = "0.7"
tokio-stream = { workspace = true }

[dev-dependencies]
themis.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
