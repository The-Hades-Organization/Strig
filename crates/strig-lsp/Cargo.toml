[package]
name = "strig-lsp"
description = "Language server for Strig policies (`.strig`): diagnostics, formatting, completion, hover, go to definition and syntax conversion over the Language Server Protocol."
keywords = ["authorization", "lsp", "language-server", "policy", "dsl"]
categories = ["authentication", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "strig-lsp"
path = "src/main.rs"

[dependencies]
strig = { workspace = true, features = ["dsl-fs"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde.workspace = true
serde_json.workspace = true
