[package]
name = "themis-macros"
description = "Compile-time macros for the Themis policy language."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
# Pinned with `=`: the expansion embeds the JSON of this exact version. Keep it equal to the
# workspace version when releasing.
themis = { path = "../themis", version = "=0.4.0", package = "themis-auth", features = ["dsl"] }
serde_json.workspace = true
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "printing"] }

[dev-dependencies]
trybuild = "=1.0.125"
