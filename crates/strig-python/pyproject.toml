[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "strig-authz"
description = "Strig authorization engine for Python: the same engine and the same JSON spec as the Rust and JavaScript APIs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hadson Ramalho" }]
requires-python = ">=3.9"
keywords = ["authorization", "permissions", "rbac", "rebac", "policy"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/The-Hades-Organization/Strig"
Repository = "https://github.com/The-Hades-Organization/Strig"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "strig._native"
features = ["extension-module"]
include = [{ path = "python/strig/py.typed", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
