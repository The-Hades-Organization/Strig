[package]
name = "strig-postgres"
description = "Postgres LISTEN/NOTIFY transport for the Strig change hub, and Postgres storage for grants, tuples, roles and pending requests."
keywords = ["authorization", "postgres", "notify", "realtime"]
categories = ["authentication", "database"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["exclusive"]
## `PgExclusiveStore`, an `ExclusiveStore` over a Postgres table (migration v4).
exclusive = ["strig/exclusive"]
## Spans (`tracing`) for the postgres transport, and everything `strig-sync/tracing` covers. Off by default; off costs nothing.
tracing = ["dep:tracing", "strig-sync/tracing"]

[dependencies]
strig.workspace = true
strig-sync.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tokio-postgres = "0.7"
tokio-stream = { workspace = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
strig = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
