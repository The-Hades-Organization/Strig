[package]
name = "strig"
description = "Extensible authorization engine: permission catalog, RBAC, ABAC and ReBAC in one decision, with governance and auditing of changes."
keywords = ["authorization", "rbac", "abac", "rebac", "permissions"]
categories = ["authentication"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["audit", "tz"]
## Trilha de auditoria das mudanças de permissão, com níveis de detalhe e cadeia de hashes.
audit = ["dep:sha2"]
## IANA time zones (`tz`) for `time_between` and `weekday_in`, through the bundled `chrono-tz` database. Without it a `tz` is refused at load.
tz = ["dep:chrono-tz", "dep:chrono"]
## Posse exclusiva de recurso com prioridade, preempção e prazo.
exclusive = []
## Policy language: lexer, validator, Blocks syntax, `Project` and the canonical JSON. Pure (no IO, no clock) and wasm-friendly.
dsl = []
## File access for the policy language (read a file, read a directory into a `Project`, write a file). Not for wasm.
dsl-fs = ["dsl"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, optional = true }
chrono-tz = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.11", optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "audit_storage"
required-features = ["audit"]

[[test]]
name = "dsl"
required-features = ["dsl-fs"]

[[test]]
name = "dsl_blocks"
required-features = ["dsl"]

[[test]]
name = "dsl_project"
required-features = ["dsl"]

[[test]]
name = "dsl_fs"
required-features = ["dsl-fs"]

[[test]]
name = "dsl_hardening"
required-features = ["dsl"]

[[bench]]
name = "listing"
harness = false

[[bench]]
name = "engine"
harness = false

[[test]]
name = "pending_audit"
required-features = ["audit"]
