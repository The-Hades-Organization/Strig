[package]
name = "themis-inspect"
description = "Visualizador de avaliações da Themis: rastro de cada decisão, simulação com outro conjunto de grants, matriz de acesso e leitura da auditoria. Interface em gpui, opcional."
keywords = ["authorization", "permissions", "gpui", "audit", "inspector"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gui"]
## Janela gpui. Sem ela sobram a biblioteca e os comandos de terminal.
gui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component"]

[dependencies]
themis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.11", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["wayland", "x11"], optional = true }
gpui-component = { version = "=0.9.0", optional = true }

[[bin]]
name = "themis-inspect"
path = "src/main.rs"
