name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag, workspace and npm versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          npm="$(node -p "require('./crates/themis-node/js/package.json').version")"
          echo "tag=$tag workspace=$crate npm=$npm"
          test "$tag" = "$crate"
          test "$tag" = "$npm"

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        run: |
          for crate in themis-auth themis-macros themis-sync themis-redis themis-postgres themis-axum themis-server; do
            cargo publish -p "$crate" --locked
            # The index takes a moment to list the new version for its dependents.
            sleep 30
          done

  native:
    name: native ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libthemis_node.so
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: libthemis_node.so
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            lib: libthemis_node.dylib
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            lib: libthemis_node.dylib
          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: themis_node.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the N-API module
        run: cargo build -p themis-node --features napi --release --locked --target ${{ matrix.target }}
      - name: Name the binary as js/node.js expects (themis.<platform>-<arch>.node)
        run: |
          mkdir -p native
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "native/themis.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native/themis.${{ matrix.platform }}.node
          if-no-files-found: error

  wasm:
    name: wasm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (same version as the crate dependency)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build the WebAssembly package
        working-directory: crates/themis-node
        run: sh scripts/build.sh wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: crates/themis-node/js/wasm/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm
      - name: Name the assets after the package and version
        run: |
          version="${TAG#v}"
          mkdir dist
          for f in native/themis.*.node; do
            platform="$(basename "$f" .node)"
            cp "$f" "dist/themis-auth-$version-${platform#themis.}.node"
          done
          tar czf "dist/themis-auth-$version-wasm.tar.gz" wasm
          test "$(ls dist/*.node | wc -l)" -eq 5
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Take the notes from the CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`toml
          themis = { package = "themis-auth", version = "$version" }
          \`\`\`

          \`\`\`sh
          npm install themis-auth@$version
          \`\`\`

          The \`.node\` files are the N-API modules shipped in the npm package; \`SHA256SUMS\` lists their hashes.

          [crates.io](https://crates.io/crates/themis-auth/$version) · [docs.rs](https://docs.rs/themis-auth/$version) · [npm](https://www.npmjs.com/package/themis-auth/v/$version)
          EOF
          cat notes.md
      - name: Create the release or refresh its assets
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi

  npm:
    name: npm
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: crates/themis-node/js/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: crates/themis-node/js/wasm
      - name: Add the README
        run: |
          blob="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}"
          cdn="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}"
          sed -e "s#src=\"assets/#src=\"$cdn/assets/#g" \
              -e "s#](LICENSE)#]($blob/LICENSE)#g" \
              -e "s#](README.pt-BR.md)#]($blob/README.pt-BR.md)#g" \
              -e "s#](CONTRIBUTING.md)#]($blob/CONTRIBUTING.md)#g" \
              README.md > crates/themis-node/js/README.md
      - name: Check the package contents
        working-directory: crates/themis-node/js
        run: |
          ls -l native wasm
          test "$(ls native | wc -l)" -eq 5
          test -s README.md
          if grep -nE '\]\((LICENSE|README\.pt-BR\.md|CONTRIBUTING\.md)\)|src="assets/' README.md; then exit 1; fi
          npm pack --dry-run
      - name: Publish
        working-directory: crates/themis-node/js
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
