name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude strig-inspect --exclude strig-python --all-targets -- -D warnings
      - run: cargo clippy -p strig-inspect --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p strig-node --features napi -- -D warnings
      - run: cargo test --workspace --exclude strig-inspect --exclude strig-python
      - run: cargo test -p strig-inspect --no-default-features
      - run: cargo clippy -p strig --no-default-features --features exclusive --all-targets -- -D warnings
      - run: cargo test -p strig --no-default-features --features exclusive
      - run: cargo clippy -p strig-server --features envoy,tracing --all-targets -- -D warnings
      - run: cargo test -p strig-server --features envoy,tracing

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p strig -p strig-sync -p strig-redis -p strig-postgres -p strig-axum -p strig-macros

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p strig-node --features wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p strig --features exclusive --target wasm32-unknown-unknown
      - run: cargo build -p strig --features dsl --target wasm32-unknown-unknown

  node:
    name: node binding (native and wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130
      - name: Install wasm-bindgen-cli (same version as the crate dependency)
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build both targets
        working-directory: crates/strig-node
        run: sh scripts/build.sh all
      - name: Install the JavaScript dependencies
        working-directory: crates/strig-node/js
        run: npm ci
      - name: Type-check, compile and run the JavaScript tests
        working-directory: crates/strig-node/js
        run: npm test

  playground:
    name: playground build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130
      - name: Install wasm-bindgen-cli (same version as the crate dependency)
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install the TypeScript toolchain (package and playground)
        run: |
          npm ci --prefix crates/strig-node/js
          npm ci --prefix playground
      - name: Build the playground
        run: sh playground/build.sh
      - name: Run the playground smoke test
        run: npm test --prefix playground

  python:
    name: python binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo clippy -p strig-python --all-targets -- -D warnings
      - run: cargo test -p strig-python
      - name: Build the extension and run the tests
        working-directory: crates/strig-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest mypy
          .venv/bin/maturin develop
          .venv/bin/mypy --strict python/strig
          .venv/bin/python -m pytest -q tests

  go:
    name: go binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - name: Build the module and test against it (not against the committed one)
        run: |
          sh bindings/scripts/build-wasi.sh jvm
          gzip -9 -n -c bindings/jvm/wasm/strig.wasm > bindings/go/strig.wasm.gz
      - working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -race ./...

  jvm:
    name: jvm binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/jvm/pom.xml
      - run: sh bindings/scripts/build-wasi.sh jvm
      - working-directory: bindings/jvm
        run: mvn -B -ntp verify
