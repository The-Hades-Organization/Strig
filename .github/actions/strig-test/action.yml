name: Strig policy tests
description: Installs the `strig` command and runs the tests that sit beside a Strig policy (`*.strig-test.json`).
author: The Hades Organization

inputs:
  path:
    description: Directory with the `*.strig` policy files and their `*.strig-test.json` files.
    required: false
    default: "."
  junit:
    description: File to write a JUnit XML report to (for a test-report action). Empty for none.
    required: false
    default: ""
  version:
    description: Version of the `strig-cli` crate to install. Pin it; empty installs the latest published one.
    required: false
    default: ""

  diff-base:
    description: Git ref to diff the policy against, such as the base of the pull request (`origin/main`). The ref must be fetched (`fetch-depth: 0`). Empty skips the diff.
    required: false
    default: ""
  diff-fail-on:
    description: "`allow` fails only when access widens; empty or `any` fails on any change. Needs a `strig-cli` version that has `strig diff`."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache the strig binary
      if: inputs.version != ''
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/strig
        key: strig-cli-${{ runner.os }}-${{ inputs.version }}
    - name: Install strig
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        STRIG_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$STRIG_VERSION" ]; then
          cargo install strig-cli --locked --version "$STRIG_VERSION"
        else
          cargo install strig-cli --locked
        fi
    - name: Run the policy tests
      shell: bash
      env:
        STRIG_PATH: ${{ inputs.path }}
        STRIG_JUNIT: ${{ inputs.junit }}
      run: |
        if [ -n "$STRIG_JUNIT" ]; then
          "$HOME/.cargo/bin/strig" test "$STRIG_PATH" --junit "$STRIG_JUNIT"
        else
          "$HOME/.cargo/bin/strig" test "$STRIG_PATH"
        fi
    - name: Diff the policy against the base
      if: inputs.diff-base != ''
      shell: bash
      env:
        STRIG_PATH: ${{ inputs.path }}
        STRIG_BASE: ${{ inputs.diff-base }}
        STRIG_FAIL_ON: ${{ inputs.diff-fail-on }}
      run: |
        base_dir="$(mktemp -d)"
        git worktree add --detach "$base_dir/base" "$STRIG_BASE"
        if [ -n "$STRIG_FAIL_ON" ]; then
          "$HOME/.cargo/bin/strig" diff "$base_dir/base/$STRIG_PATH" "$STRIG_PATH" --fail-on "$STRIG_FAIL_ON"
        else
          "$HOME/.cargo/bin/strig" diff "$base_dir/base/$STRIG_PATH" "$STRIG_PATH"
        fi
