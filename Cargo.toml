[workspace]
resolver = "3"
members = ["crates/strig", "crates/strig-sync", "crates/strig-redis", "crates/strig-postgres", "crates/strig-axum", "crates/strig-node", "crates/strig-inspect", "crates/strig-server", "crates/strig-macros"]
default-members = ["crates/strig", "crates/strig-sync", "crates/strig-redis", "crates/strig-postgres", "crates/strig-axum", "crates/strig-node"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Strig"
homepage = "https://github.com/The-Hades-Organization/Strig"
authors = ["Hadson Ramalho"]

[workspace.dependencies]
strig = { path = "crates/strig", version = "0.5.0" }
strig-sync = { path = "crates/strig-sync", version = "0.5.0" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
