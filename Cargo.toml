[workspace]
resolver = "3"
members = ["crates/themis", "crates/themis-sync", "crates/themis-redis", "crates/themis-postgres", "crates/themis-axum", "crates/themis-node", "crates/themis-inspect"]
default-members = ["crates/themis", "crates/themis-sync", "crates/themis-redis", "crates/themis-postgres", "crates/themis-axum", "crates/themis-node"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Themis"
publish = false

[workspace.dependencies]
themis = { path = "crates/themis", version = "0.2.0" }
themis-sync = { path = "crates/themis-sync", version = "0.2.0" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
