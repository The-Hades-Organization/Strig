<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Strig Inspector</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="inspector.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-bang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.4v.1"/></symbol>
    <symbol id="i-dash" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3M13 5h6v6M19 5l-8 8"/></symbol>
    <symbol id="mark" viewBox="0 0 64 64">
      <mask id="strig-cut" maskUnits="userSpaceOnUse" x="0" y="-2" width="64" height="66">
        <rect x="0" y="-2" width="64" height="66" fill="#fff"/>
        <path class="m-fangs" d="M19.5 -1H28.5C28.5 15.5 27.3 26.72 25.5 32C23.7 26.72 19.5 15.5 19.5 -1Z M35.5 -1H44.5C44.5 15.5 40.3 26.72 38.5 32C36.7 26.72 35.5 15.5 35.5 -1Z" fill="#000"/>
      </mask>
      <circle class="m-disc" cx="32" cy="32" r="29" mask="url(#strig-cut)"/>
    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand">
    <svg class="mark" role="img" aria-label="Strig mark"><use href="#mark"/></svg>
    <h1 class="plain">Inspector</h1>
  </div>
  <div class="spacer"></div>
  <a class="iconbtn" href="./" id="back"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg><span class="label">Playground</span></a>
  <button class="iconbtn" id="theme" type="button" aria-label="Switch to dark theme"><svg class="i"><use href="#i-moon"/></svg></button>
</header>

<main class="insp">
  <div class="side">
    <section class="card block" aria-labelledby="scenario-cap">
      <span class="cap" id="scenario-cap">Scenario</span>
      <div class="row">
        <button class="btn" id="load-example" type="button">Example</button>
        <button class="btn" id="load-file" type="button">Open file</button>
        <button class="btn" id="load-paste" type="button" aria-expanded="false" aria-controls="paste-box">Paste</button>
        <input class="sr" id="file-scenario" type="file" accept=".json,application/json" tabindex="-1" aria-label="Scenario file">
      </div>
      <div class="pastebox" id="paste-box" hidden>
        <label class="sr" for="paste-scenario">Scenario JSON</label>
        <textarea id="paste-scenario" spellcheck="false" autocomplete="off" rows="6" placeholder='{"spec": {...}, "grants": [...], "subjects": {...}, "resources": {...}}'></textarea>
        <button class="btn primary" id="paste-go" type="button">Load</button>
      </div>
      <p class="note-bad" id="scenario-error" role="alert" hidden></p>
      <p class="fine" id="scenario-info"></p>
    </section>

    <section class="card block" aria-labelledby="sim-cap" id="sim">
      <span class="cap" id="sim-cap">Simulation</span>
      <div id="sim-body"></div>
    </section>
  </div>

  <section class="card ruling main" aria-label="Inspector">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-evaluation" aria-controls="pane-evaluation" aria-selected="true" data-tab="evaluation" type="button">Evaluation</button>
      <button role="tab" id="tab-matrix" aria-controls="pane-matrix" aria-selected="false" data-tab="matrix" type="button">Matrix</button>
      <button role="tab" id="tab-audit" aria-controls="pane-audit" aria-selected="false" data-tab="audit" type="button">Audit</button>
      <span class="rule" id="rule" aria-hidden="true"></span>
    </div>
    <div class="pane" id="pane-evaluation" role="tabpanel" aria-labelledby="tab-evaluation" data-on="true"></div>
    <div class="pane" id="pane-matrix" role="tabpanel" aria-labelledby="tab-matrix"></div>
    <div class="pane" id="pane-audit" role="tabpanel" aria-labelledby="tab-audit"></div>
  </section>
</main>
<p class="foot">Everything on this page runs in the page itself: the scenario and the trail you load never leave the browser, and every ruling comes from the Strig WebAssembly engine.</p>
<noscript><p class="foot">This inspector needs JavaScript.</p></noscript>
<script type="module" src="inspector.js"></script>
</body>
</html>
